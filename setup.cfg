[flake8]
# flake8 does not read pyproject.toml
select = E, W, F, C90, WPS
max-line-length = 120
exclude = .git, __pycache__, .venv, .mypy_cache, build, dist
per-file-ignores =
    # package public API: re-exports and __all__
    fastapi_depends/__init__.py: WPS412, WPS410
    # runnable examples: print results, FastAPI Depends() in default values
    examples/*.py: WPS421, WPS404
