[project]
name = "fastapi-depends"
version = "0.2.1"
description = "Use your FastAPI dependencies in plain python code"
authors = [{ name = "troyan-dy" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
]

[project.urls]
repository = "https://github.com/troyan-dy/fastapi-depends"
homepage = "https://github.com/troyan-dy/fastapi-depends"
documentation = "https://github.com/troyan-dy/fastapi-depends#readme"

[tool.poetry]
packages = [{ include = "fastapi_depends" }]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
flake8 = "^7.4.1"
mypy = "^2.4.0"


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
line_length=120
multi_line_output=3
include_trailing_comma=true
force_grid_wrap=0
use_parentheses=true

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
